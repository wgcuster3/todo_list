<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <div id="leftColumn">
      <h2>Your Lists</h2>
      <button id="addListBtn">Add List</button>
      <ul id="listContainer">
      </ul>
    </div>
    
    <div id="rightColumn">
      <div id="listHeader">
        <h2 id="currentListDisplay"></h2>
        <button id="addTodoBtn">Add Todo</button>
      </div>
      <div id="todoContainer">
      </div>
    </div>

    <dialog id="todoDialog">
      <form method="dialog">
        <h2 id="dialogLabel">New Todo</h2>

        <div class="dialog-group">
          <label for="dialogTitle">Title</label>
          <input type="text" id="dialogTitle" required>
        </div>

        <div class="dialog-group">
          <label for="dialogDesc">Description</label>
          <input type="text" id="dialogDesc">
        </div>

        <div class="dialog-group">
          <label for="dialogDueDate">Due Date</label>
          <input type="date" id="dialogDueDate">
        </div>
      
        <div class="dialog-group">
          <label for="dialogPriority">Priority</label>
          <select id="dialogPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      
        <button type="submit" value="add">Save</button>
        <button type="button" commandfor="todoDialog" command="close">Close</button>
      </form>    
    </dialog>
    
</body>
</html>
